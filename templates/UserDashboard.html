<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Subscribed Courses</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 32px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .courses-list {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-top: 32px;
            justify-content: center;
        }
        .course-card {
            background: #f9fafb;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            width: 260px;
            padding: 20px;
            transition: box-shadow 0.2s;
        }
        .course-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .course-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .course-desc {
            color: #555;
            font-size: 0.98em;
            margin-bottom: 12px;
        }
        .course-link {
            display: inline-block;
            padding: 6px 14px;
            background: #3182ce;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.95em;
        }
        .course-link:hover {
            background: #225ea8;
        }
    </style>
</head>
<body>
    <h1>User Dashboard - Subscribed Courses</h1>
</body>
</html>
