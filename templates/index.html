<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TechN</title>
    <link rel="stylesheet" href="/static/TechN.css">
    <script src="/static/jscode/slider.js"></script>
</head>

<body>
    <div class="nav">
        <div class="logo" style="height: 20px;"></div>
        <img src="" alt="Logo" class="logo">
        <div class="nav-right">
            <a href="/login" class="BT-A">Login</a>
            <a href="/signup" class="BT-A">Join For Free</a>
        </div>
    </div>
    <br>
    <!-- Slideshow container -->
    <div class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="/static/slide/slide1.jpg" style="width:100%">
            <div class="text">Caption Text</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="/static/slide/slide2.jpg" style="width:100%">
            <div class="text">Caption Two</div>
        </div>


        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    <!-- The dots/circles -->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
    </div>

    <h1>Welcome to TechN</h1>
    {% if person %}
    <h1>Hello {{ person }}!</h1>
    {% else %}
    <h1>Hello, World!</h1>
    {% endif %}
    -->
</body>

</html>
